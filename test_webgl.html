<!DOCTYPE html>
<html>
<head><title>WebGL Test</title></head>
<body style="background:#111; color:white; font-family:Arial; padding:20px;">
<h2>WebGL Support Test</h2>
<canvas id="c" width="500" height="200" style="border:2px solid #888;"></canvas>
<div id="result" style="margin-top:15px; font-size:18px;"></div>
<script>
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
var result = document.getElementById('result');
if (gl) {
  var renderer = gl.getParameter(gl.RENDERER);
  var vendor = gl.getParameter(gl.VENDOR);
  gl.clearColor(0.1, 0.3, 0.8, 1.0); // Biru
  gl.clear(gl.COLOR_BUFFER_BIT);
  result.innerHTML = 
    '<p style="color:#0f0;font-size:22px;">✅ WebGL BERFUNGSI!</p>' +
    '<p>GPU: <b style="color:yellow">' + renderer + '</b></p>' +
    '<p>Vendor: ' + vendor + '</p>' +
    '<p style="color:#aaa;">VPython seharusnya bisa berjalan di browser ini.</p>';
} else {
  result.innerHTML = 
    '<p style="color:#f44;font-size:22px;">❌ WebGL TIDAK BERFUNGSI!</p>' +
    '<p>Hardware acceleration mungkin dimatikan di browser kamu.</p>' +
    '<p style="color:#ffa;">Solusi: Buka Edge Settings → System → Hardware Acceleration → ON</p>';
}
</script>
</body>
</html>
